- name: firefox custom
  prefix: Ctrl + Alt
  keybinds:
    - name: Fullscreen
      key: f
- name: gimp custom
  prefix: Ctrl + Alt
  keybinds:
  - name: Canvas size
    key: s
  - name: Lower layer
    key: j
  - name: Raise layer
    key: k
  - name: Scale layer
    key: l
- name: tridactyl
  # prefix: Ctrl + Alt
  keybinds:
  - name: New tab
    key: a
  - name: Close tab
    key: x
